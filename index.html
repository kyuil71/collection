<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection</title>
  <style>
    :root { --bg:#f4f4f2; --fg:#1b1b1b; --muted:#6b6b6b; --line:#d9d9d4; --card:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#151516; --fg:#ececec; --muted:#9a9a9a; --line:#2c2c2e; --card:#1d1d1f; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.item { display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 20px 22px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .15s; }
    a.item:hover { border-color: var(--fg); }
    .name { font-size: 18px; font-weight: 600; }
    .desc { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .arrow { font-size: 20px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Collection</h1>
    <p class="sub">브라우저에서 바로 실행되는 도구 모음</p>
    <ul>
      <li>
        <a class="item" href="./pdf-editor/">
          <div>
            <div class="name">PDF Editor</div>
            <div class="desc">PDF 읽기·편집·병합·분할·보안 (PdfCraft 기반, 설치 없이 실행)</div>
          </div>
          <span class="arrow">→</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
